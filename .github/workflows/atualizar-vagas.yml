name: Atualizar vagas

on:
  workflow_dispatch:
    inputs:
      sync_production:
        description: "Atualizar o Supabase (upsert; sem excluir vagas; InfoJobs pode ser omitido se bloqueado)"
        type: boolean
        required: false
        default: false

  schedule:
    # Brasília (UTC-3).
    # Evita o minuto 00, quando o GitHub pode atrasar ou descartar agendamentos.
    # 08:07 BRT = 11:07 UTC; 18:07 BRT = 21:07 UTC.
    # Uma alteração do cron também reativa agendamentos suspensos por inatividade.
    - cron: "7 11,21 * * *"

permissions:
  contents: read

concurrency:
  group: radar-vagas-update
  cancel-in-progress: false

jobs:
  atualizar-vagas:
    name: Coletar, normalizar e sincronizar
    # Agendamento sincroniza cinco fontes obrigatórias; InfoJobs só se completo.
    # Execução manual testa sem escrever, salvo quando a caixa de autorização for marcada.
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      NODE_ENV: production

      # InHire
      INHIRE_CACHE_MAX_AGE_HOURS: "168"

      # InfoJobs
      INFOJOBS_DETAIL_CACHE_MAX_AGE_HOURS: "168"
      INFOJOBS_ENABLE_DETAIL_FALLBACK: "false"
      INFOJOBS_STATE_CONCURRENCY: "1"
      INFOJOBS_REQUEST_DELAY_MS: "350"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      - name: Restaurar cache de published_at do InHire
        id: inhire-published-cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/inhire-published-cache.json
          key: inhire-published-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            inhire-published-${{ runner.os }}-

      - name: Restaurar cache de detalhes do InfoJobs
        id: infojobs-detail-cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/infojobs-detail-cache.json
          key: infojobs-detail-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            infojobs-detail-${{ runner.os }}-

      - name: Remover resultados antigos do checkout
        shell: bash
        run: |
          rm -f scripts/gupy-results.json
          rm -f scripts/inhire-results.json
          rm -f scripts/greenhouse-results.json
          rm -f scripts/lever-results.json
          rm -f scripts/ashby-results.json
          rm -f scripts/infojobs-results.json
          rm -f scripts/radar-jobs.json
          rm -f scripts/radar-jobs-report.json

      - name: Coletar Gupy
        id: gupy
        continue-on-error: true
        run: node scripts/collect-gupy.mjs

      - name: Coletar InHire
        id: inhire
        continue-on-error: true
        run: node scripts/collect-inhire.mjs

      - name: Salvar cache de published_at do InHire
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/inhire-published-cache.json
          key: inhire-published-${{ runner.os }}-${{ github.run_id }}

      - name: Coletar Greenhouse
        id: greenhouse
        continue-on-error: true
        run: node scripts/collect-greenhouse.mjs

      - name: Coletar Lever
        id: lever
        continue-on-error: true
        run: node scripts/collect-lever.mjs

      - name: Coletar Ashby
        id: ashby
        continue-on-error: true
        run: node scripts/collect-ashby.mjs

      - name: Coletar InfoJobs
        id: infojobs
        continue-on-error: true
        run: node scripts/collect-infojobs.mjs

      - name: Salvar cache de detalhes do InfoJobs
        if: ${{ always() && hashFiles('.cache/infojobs-detail-cache.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: .cache/infojobs-detail-cache.json
          key: infojobs-detail-${{ runner.os }}-${{ github.run_id }}

      # Uma falha InfoJobs não pode bloquear as outras cinco fontes.
      # O merge descartará INTEGRALMENTE o arquivo InfoJobs se a coleta tiver falhado.
      # A escrita é somente upsert: nenhuma ausência desativa vagas existentes.
      - name: Validar sucesso das fontes obrigatórias
        env:
          GUPY_OUTCOME: ${{ steps.gupy.outcome }}
          INHIRE_OUTCOME: ${{ steps.inhire.outcome }}
          GREENHOUSE_OUTCOME: ${{ steps.greenhouse.outcome }}
          LEVER_OUTCOME: ${{ steps.lever.outcome }}
          ASHBY_OUTCOME: ${{ steps.ashby.outcome }}
          INFOJOBS_OUTCOME: ${{ steps.infojobs.outcome }}
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const sources = ["gupy", "inhire", "greenhouse", "lever", "ashby", "infojobs"];
          const errors = [];

          for (const source of sources) {
            const outcome = process.env[`${source.toUpperCase()}_OUTCOME`];
            const path = `scripts/collect-${source === "gupy" ? "gupy" : source}.mjs`;
            const resultPath = `scripts/${source}-results.json`;

            if (outcome !== "success") {
              if (source === "infojobs") {
                console.warn("::warning::InfoJobs incompleto/bloqueado; será omitido da carga, sem excluir registros existentes.");
                continue;
              }
              errors.push(`${source}: coletor terminou com status ${outcome || "desconhecido"}`);
              continue;
            }
            if (!fs.existsSync(resultPath)) {
              errors.push(`${source}: arquivo ${resultPath} não gerado`);
              continue;
            }
            try {
              const rows = JSON.parse(fs.readFileSync(resultPath, "utf8"));
              if (!Array.isArray(rows) || rows.length === 0) {
                errors.push(`${source}: catálogo vazio ou inválido`);
              } else {
                console.log(`${source}: ${rows.length} vagas coletadas`);
              }
            } catch (error) {
              errors.push(`${source}: JSON inválido (${error.message})`);
            }
          }

          if (errors.length > 0) {
            console.error("Sincronização bloqueada para preservar os dados existentes:");
            for (const error of errors) console.error(`- ${error}`);
            process.exitCode = 1;
          }
          NODE

      - name: Merge e deduplicação
        env:
          RADAR_ALLOW_MISSING_INFOJOBS: ${{ steps.infojobs.outcome != 'success' && 'true' || 'false' }}
        run: node scripts/merge-jobs.mjs

      - name: Validar arquivo final
        shell: bash
        env:
          RADAR_ALLOW_MISSING_INFOJOBS: ${{ steps.infojobs.outcome != 'success' && 'true' || 'false' }}
        run: |
          test -f scripts/radar-jobs.json || {
            echo "::error::scripts/radar-jobs.json não foi gerado."
            exit 1
          }

          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const path = "scripts/radar-jobs.json";
          const jobs = JSON.parse(fs.readFileSync(path, "utf8"));

          if (!Array.isArray(jobs)) {
            throw new Error("radar-jobs.json não contém um array.");
          }

          if (jobs.length === 0) {
            throw new Error(
              "radar-jobs.json ficou vazio. Sync cancelado por segurança.",
            );
          }

          const sources = new Set(
            jobs.map((job) => job.source),
          );

          const expected = [
            "gupy",
            "inhire",
            "greenhouse",
            "lever",
            "ashby",
            "infojobs",
          ];

          const { validateSourceCoverage } = await import("./scripts/source-availability.mjs");
          const counts = Object.fromEntries(expected.map((source) => [
            source, jobs.filter((job) => job.source === source).length,
          ]));
          const coverage = validateSourceCoverage(counts, {
            allowMissingInfojobs: process.env.RADAR_ALLOW_MISSING_INFOJOBS === "true",
          });
          if (coverage.partial) {
            console.warn("::warning::Carga parcial: InfoJobs excluído; cinco fontes serão atualizadas.");
          }

          console.log(
            `Vagas prontas para sincronização: ${jobs.length}`,
          );

          console.log(
            `Fontes: ${[...sources].sort().join(", ")}`,
          );
          NODE

      # Backup, constraint InfoJobs e sincronização inicial foram validados em 14/11/2026.
      # Cron: duas atualizações por dia; execução manual exige opt-in para gravar.
      # A carga faz somente upsert: não desativa nem exclui vagas existentes.
      # Secrets ficam EXCLUSIVAMENTE nos steps de validação e sync.
      # Não expor credenciais de produção a npm ci, caches ou coletores externos.
      - name: Validar credenciais somente antes da sincronização
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.sync_production == true) }}
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "::error::Secret SUPABASE_URL não configurado."
            exit 1
          fi
          if [ -z "$SUPABASE_SECRET_KEY" ]; then
            echo "::error::Secret SUPABASE_SECRET_KEY não configurado."
            exit 1
          fi
          if [[ "$SUPABASE_SECRET_KEY" != sb_secret_* ]]; then
            echo "::error::SUPABASE_SECRET_KEY deve ser uma Secret Key do Supabase."
            exit 1
          fi

      - name: Sincronizar Supabase (somente upsert)
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.sync_production == true) }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          RADAR_ALLOW_MISSING_INFOJOBS: ${{ steps.infojobs.outcome != 'success' && 'true' || 'false' }}
        run: node scripts/sync-supabase.mjs --apply

      - name: Execução manual sem gravação no banco
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.sync_production != true }}
        run: |
          echo "Coleta e merge concluídos. Modo manual de diagnóstico: nenhuma vaga foi gravada."
          echo "Para sincronizar manualmente, execute novamente marcando sync_production."

      - name: Resumo da execução
        if: always()
        shell: bash
        run: |
          echo "## Radar Vagas — atualização" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Horário UTC: $(date -u '+%Y-%m-%d %H:%M:%S')" >> "$GITHUB_STEP_SUMMARY"
          echo "- Programação: 08h07 e 18h07 (horário de Brasília, UTC-3)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tipo de execução: ${{ github.event_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Escrita autorizada: ${{ github.event_name == 'schedule' || inputs.sync_production == true }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Política: somente upsert (sem desativação/exclusão)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Coleta InfoJobs: ${{ steps.infojobs.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.infojobs.outcome }}" != "success" ]; then
            echo "- ATENÇÃO: InfoJobs falhou; dados existentes preservados. Outras fontes podem ter sido atualizadas." >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -f scripts/radar-jobs.json ]; then
            TOTAL=$(node -e "const fs=require('fs'); const j=JSON.parse(fs.readFileSync('./scripts/radar-jobs.json','utf8')); console.log(j.length)")
            echo "- Merge desta execução: $TOTAL vagas" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Merge desta execução: não concluído" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "${{ steps.infojobs.outcome }}" != "success" ]; then
            echo "- InfoJobs: ERRO — arquivo parcial descartado da sincronização" >> "$GITHUB_STEP_SUMMARY"
          elif [ -f scripts/infojobs-results.json ]; then
            INFOJOBS_TOTAL=$(node -e "const fs=require('fs'); const j=JSON.parse(fs.readFileSync('./scripts/infojobs-results.json','utf8')); console.log(j.length)")
            echo "- InfoJobs: $INFOJOBS_TOTAL vagas" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- InfoJobs: não concluído" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -f .cache/inhire-published-cache.json ]; then
            CACHE_TOTAL=$(node -e "const fs=require('fs'); const c=JSON.parse(fs.readFileSync('./.cache/inhire-published-cache.json','utf8')); console.log(Object.keys(c.items ?? {}).length)")
            echo "- Cache InHire: $CACHE_TOTAL datas conhecidas" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Cache InHire: não gerado" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -f .cache/infojobs-detail-cache.json ]; then
            INFOJOBS_CACHE_TOTAL=$(node -e "const fs=require('fs'); const c=JSON.parse(fs.readFileSync('./.cache/infojobs-detail-cache.json','utf8')); console.log(Object.keys(c ?? {}).length)")
            echo "- Cache InfoJobs: $INFOJOBS_CACHE_TOTAL registros" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Cache InfoJobs: não gerado" >> "$GITHUB_STEP_SUMMARY"
          fi
      # Envia sinal claro ao GitHub (e às notificações por e-mail):
      # houve atualização das cinco fontes, mas o InfoJobs permanece indisponível.
      - name: Alertar coleta parcial após preservar as demais fontes
        if: ${{ always() && steps.infojobs.outcome != 'success' }}
        run: |
          echo "::error::InfoJobs não concluiu a coleta. As outras fontes foram processadas quando válidas; veja o resumo e o banco."
          exit 1
