name: Publicar Radar Vagas no Cloudflare

# Alternativa controlada ao Workers Builds nativo, caso a compilação
# hospedada no Cloudflare falhe. Não cria outra aplicação/Worker.
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: radar-vagas-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Validar e publicar Worker existente
    # Só um despacho manual ou um opt-in explícito habilita a publicação.
    if: ${{ github.event_name == 'workflow_dispatch' || vars.RADAR_ENABLE_GITHUB_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    steps:
      - name: Checkout exato do commit
        uses: actions/checkout@v4

      - name: Configurar Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Instalar dependências pelo lockfile
        run: npm ci --no-audit --no-fund

      - name: Testar os coletores e a interface
        run: |
          node --test scripts/tests/*.test.mjs
          npx tsc --noEmit
          npm audit --omit=dev --audit-level=high

      - name: Compilar site e servidor
        run: npm run build

      - name: Validar pacote Cloudflare sem publicar
        run: npx --yes wrangler@4.162.0 deploy --dry-run --outdir /tmp/radar-dry-run

      - name: Validar presença das credenciais de implantação
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || {
            echo "::error::Configure o secret CLOUDFLARE_API_TOKEN no repositório."
            exit 1
          }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || {
            echo "::error::Configure o secret CLOUDFLARE_ACCOUNT_ID no repositório."
            exit 1
          }

      - name: Publicar no Worker existente
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.162.0 deploy --name teuscarvalho-radar-vagas-hub

      - name: Testar HTTP da publicação
        shell: bash
        run: |
          set -euo pipefail
          ROOT="https://teuscarvalho-radar-vagas-hub.teuscarvalho.workers.dev"
          curl --fail --silent --show-error --retry 3 --retry-delay 3 --max-time 20 --output /dev/null "$ROOT/"
          curl --fail --silent --show-error --retry 3 --retry-delay 3 --max-time 20 --output /dev/null "$ROOT/vagas"
          echo "HTTP OK: / e /vagas"

      - name: Resumo
        if: always()
        shell: bash
        run: |
          echo "## Radar Vagas — deploy Cloudflare" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Ambiente: production" >> "$GITHUB_STEP_SUMMARY"
          echo "- Worker: teuscarvalho-radar-vagas-hub" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: https://teuscarvalho-radar-vagas-hub.teuscarvalho.workers.dev" >> "$GITHUB_STEP_SUMMARY"
